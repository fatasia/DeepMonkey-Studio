name: studio-online-editor
services:
  studio:
    image: deep-monkey-studio:${STUDIO_VERSION:-0.2.0}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    ports: ["127.0.0.1:${STUDIO_ONLINE_API_PORT:-44100}:4100"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    environment:
      WEB_ORIGIN: ${STUDIO_ONLINE_WEB_ORIGIN:-http://localhost:44101}
      METADATA_STORE: postgres
      OBJECT_STORE: minio
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: studio_online_demo
      POSTGRES_USER: studio_online_demo
      POSTGRES_PASSWORD: ${STUDIO_ONLINE_POSTGRES_PASSWORD:?Set independent online-demo credentials}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${STUDIO_ONLINE_MINIO_USER:?Set independent online-demo credentials}
      MINIO_SECRET_KEY: ${STUDIO_ONLINE_MINIO_PASSWORD:?Set independent online-demo credentials}
      MINIO_BUCKET: studio-online-demo
      BIM_STUDIO_ADMIN_PASSWORD: ${STUDIO_ONLINE_ADMIN_PASSWORD:?Set independent online-demo credentials}
      BIM_STUDIO_SESSION_SECRET: ${STUDIO_ONLINE_SESSION_SECRET:?Set independent online-demo credentials}
    volumes: ["studio-data:/var/lib/studio"]
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio_online_demo
      POSTGRES_USER: studio_online_demo
      POSTGRES_PASSWORD: ${STUDIO_ONLINE_POSTGRES_PASSWORD:?Set independent online-demo credentials}
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio_online_demo -d studio_online_demo"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  minio:
    image: ${BIM_STUDIO_MINIO_IMAGE:-bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STUDIO_ONLINE_MINIO_USER:?Set independent online-demo credentials}
      MINIO_ROOT_PASSWORD: ${STUDIO_ONLINE_MINIO_PASSWORD:?Set independent online-demo credentials}
    volumes: ["minio-data:/bitnami/minio"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  studio-data: {}
  postgres-data: {}
  minio-data: {}
