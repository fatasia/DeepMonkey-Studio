[package]
name = "bim-studio-desktop"
version = "0.1.0"
description = "Thin Tauri host for Deep Monkey Studio"
authors = ["Deep Monkey Studio"]
edition = "2024"
license-file = "../../../LICENSE"

[lib]
name = "bim_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
getrandom = "0.3"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.11.5", features = [] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }
