<!doctype html>
<html lang="zh-CN" data-theme="dark"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Deep Engine · Three WebGPU 公平基准</title>
  <link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/benchmark.css">
</head><body><main class="benchmark-shell">
  <header><div><strong>Deep Engine</strong><span>公平性能实验室</span></div><a href="/">返回渲染实验室</a></header>
  <section class="heading"><div><p>WebGPU / 固定质量合同</p><h1>相同场景，成对交错采样。</h1></div>
    <p id="benchmark-status" role="status" aria-live="polite">选择实例规模后开始。</p></section>
  <section class="controls"><label for="count">实例数量</label><select id="count">
    <option value="1024">1,024</option><option value="10000">10,000</option></select>
    <label for="profile">质量配置</label><select id="profile"><option value="baseline-equivalent">Baseline 等价</option>
      <option value="high-native">High 原生</option></select>
    <button id="run" type="button">执行 5 轮 A/B</button><button id="save" type="button" disabled>保存机器证据</button></section>
  <section class="canvases" aria-label="双引擎冻结画面">
    <figure><figcaption>Deep WebGPU</figcaption><canvas id="candidate-canvas" width="960" height="540"></canvas></figure>
    <figure><figcaption>Three.js 0.185.1 WebGPU</figcaption><canvas id="reference-canvas" width="960" height="540"></canvas></figure>
  </section>
  <section class="metrics"><div><span>Deep CPU P95</span><strong id="candidate-cpu">—</strong></div>
    <div><span>Three CPU P95</span><strong id="reference-cpu">—</strong></div>
    <div><span>画面相似度</span><strong id="similarity">—</strong></div>
    <div><span>判断</span><strong id="decision">—</strong></div></section>
  <details><summary>机器可读记录</summary><p>当前环境贴图、级联阴影和后处理尚未逐项等价时，合同会标记 degraded 并抑制排名。</p>
    <pre id="benchmark-output">尚未运行。</pre></details>
</main><script type="module" src="/benchmark.js"></script></body></html>
