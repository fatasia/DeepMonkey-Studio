[package]
name = "deep-engine-native"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Native winit + wgpu viewer bootstrap for Deep Engine"
license-file = "../../LICENSE"
repository = "https://github.com/fatasia/DeepMonkey-Studio"
homepage = "https://github.com/fatasia/DeepMonkey-Studio"
publish = false

[features]
native-bench = []

[dependencies]
bytemuck = "=1.25.2"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
# 簇 LOD 运行时(批 C):.dgc 读取唯一权威(geometry_dag::read_dgc)以 path 依赖接入,
# 与 TS decodeDgc 跨工具链 sha256 钉版同源(dgc_byte_golden 门)。开源依赖审计:
# geometry_dag 传递依赖 thiserror =2.0.20(已是本 lock 存量)与 flate2 =1.1.10
# (rust_backend → miniz_oxide/adler2/crc32fast,geometry_dag/Cargo.lock 同版本集,
# 85aeef75 字节黄金钉版时已审计;版本经 geometry_dag/Cargo.toml 等号钉死,不引新大版本)。
geometry_dag = { path = "geometry_dag" }
pollster = "=1.0.1"
rapier3d = { version = "=0.36.0", default-features = true, features = ["enhanced-determinism"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
# deep2d 刀2 组件布局(flexbox)。开源依赖门槛审计结论:taffy 0.14.0(MIT,crates.io
# SHA-256 639627c87f43b9181c811f40a6296409e093a17bc761214cba3c15df74f86b99),
# default-features 关闭后 flexbox+taffy_tree 特性的传递依赖仅 arrayvec ^0.7 /
# slotmap ^1.0.6,两者已是 Cargo.lock 存量传递依赖(0.7.8 / 1.1.1)——本依赖
# 不新增任何其他包,grid/parse/serde/block/float 等未启用特性不进依赖树。
# 确定性:纯 Rust 无 I/O,同输入逐位同输出,黄金用例钉死(见 src/deep2d/layout/)。
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
unicode-segmentation = "=1.13.3"
web-time = "=1.1.0"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = ["HtmlCanvasElement"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp"] }
# 波次5 render_graph_tests:ToolHelp 线程快照用于「executor 线程池清理」
# 证据(批次前后 OS 线程数水位)。既有固定版本的 feature flag 追加,
# 无新包、Cargo.lock 不变(同 P1-16 先例)。
# P1-16 UIA bridge: windows-sys only links the UIA free functions and has no
# provider/client COM interfaces, so provider objects use the `windows` crate.
# 0.62.2 is already locked as a transitive dependency (wgpu/dx12), so this adds
# feature flags to a locked version — no new package, Cargo.lock unchanged.
windows = { version = "=0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dwm"] }
# `windows::core::implement` expands to `::windows_core::` paths, which needs
# windows-core as a direct dependency (already locked at 0.62.2).
windows-core = { version = "=0.62.2" }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
