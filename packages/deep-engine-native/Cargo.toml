[package]
name = "deep-engine-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native winit + wgpu viewer bootstrap for Deep Engine"
license-file = "../../LICENSE"
repository = "https://github.com/fatasia/bim-studio"
homepage = "https://github.com/fatasia/bim-studio"
publish = false

[dependencies]
bytemuck = "=1.25.2"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
pollster = "=1.0.1"
rapier3d = { version = "=0.35.3", default-features = true, features = ["enhanced-determinism"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
unicode-segmentation = "=1.13.3"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp"] }
# 波次5 render_graph_tests:ToolHelp 线程快照用于「executor 线程池清理」
# 证据(批次前后 OS 线程数水位)。既有固定版本的 feature flag 追加,
# 无新包、Cargo.lock 不变(同 P1-16 先例)。
# P1-16 UIA bridge: windows-sys only links the UIA free functions and has no
# provider/client COM interfaces, so provider objects use the `windows` crate.
# 0.62.2 is already locked as a transitive dependency (wgpu/dx12), so this adds
# feature flags to a locked version — no new package, Cargo.lock unchanged.
windows = { version = "=0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }
# `windows::core::implement` expands to `::windows_core::` paths, which needs
# windows-core as a direct dependency (already locked at 0.62.2).
windows-core = { version = "=0.62.2" }
rodio = { version = "=0.22.2", default-features = false, features = ["playback", "mp4"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
