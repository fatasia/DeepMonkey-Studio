[package]
name = "deep-engine-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Native winit + wgpu viewer bootstrap for Deep Engine"
license-file = "../../LICENSE"
repository = "https://github.com/fatasia/bim-studio"
homepage = "https://github.com/fatasia/bim-studio"
publish = false

[dependencies]
bytemuck = "=1.25.2"
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
pollster = "=1.0.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
unicode-segmentation = "=1.13.3"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
