[package]
name = "deep-bevy-benchmark-runner"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["3d"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

