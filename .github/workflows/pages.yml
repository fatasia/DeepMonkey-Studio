name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/video.html"
      - "docs/poster.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp docs/video.html docs/poster.png _site/
          curl -L --fail --retry 3 "https://github.com/fatasia/DeepMonkey-Studio/releases/download/v0.1.0/deepmonkey-studio-intro.mp4" -o _site/deepmonkey-studio-intro.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

