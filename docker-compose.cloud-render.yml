services:
  cloud-render-worker:
    build:
      context: .
      dockerfile: apps/cloud-render-worker/Dockerfile
    init: true
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "4200:4200"
    environment:
      CLOUD_RENDER_WORKER_ID: "gpu-worker-1"
      CLOUD_RENDER_WORKER_HOST: "0.0.0.0"
      CLOUD_RENDER_WORKER_PORT: "4200"
      CLOUD_RENDER_WORKER_TOKEN: "${CLOUD_RENDER_WORKER_TOKEN:?set CLOUD_RENDER_WORKER_TOKEN}"
      CLOUD_RENDER_WORKER_PUBLIC_ORIGIN: "${CLOUD_RENDER_WORKER_PUBLIC_ORIGIN:-http://localhost:4200}"
      CLOUD_RENDER_CHROMIUM_PATH: "/usr/bin/chromium"
      CLOUD_RENDER_HEADLESS: "false"
      CLOUD_RENDER_MAX_SESSIONS: "${CLOUD_RENDER_MAX_SESSIONS:-1}"
      CLOUD_RENDER_GPU_MEMORY_MIB: "${CLOUD_RENDER_GPU_MEMORY_MIB:-}"
      CLOUD_RENDER_VERIFIED_HARDWARE_CODECS: "${CLOUD_RENDER_VERIFIED_HARDWARE_CODECS:-}"
      CLOUD_RENDER_ICE_SERVERS_JSON: "${CLOUD_RENDER_ICE_SERVERS_JSON:-[]}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
